global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Regras de alerta
rule_files:
  - 'alert.rules'

# Configurações de descoberta de alvos
scrape_configs:
  # Monitoramento do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scheme: 'http'

  # Monitoramento do PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']
    metrics_path: '/metrics'
    scheme: 'http'
    params:
      collect[]:
        - custom_query.pg_stat_statements
        - standard

  # Métricas da aplicação Node.js
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: '/metrics'
    scheme: 'http'

# Configurações de alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Configurações de regras de alerta
rule_files:
  - 'alert.rules'
