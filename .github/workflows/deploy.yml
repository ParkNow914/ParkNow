name: Deploy to Fly.io

# Deploy GATEADO: só roda DEPOIS que o "CI/CD Pipeline" (lint + 76 testes +
# E2E Playwright + CodeQL) conclui com SUCESSO na main. Isso impede que um
# frontend/refator quebrado chegue à produção — antes o deploy disparava em
# paralelo ao CI no push, sem esperar os testes.
#
# Requer o secret FLY_API_TOKEN:
#   Settings → Secrets and variables → Actions → New repository secret
#   Nome: FLY_API_TOKEN   Valor: (gerado com `fly tokens create deploy`)

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # deploy manual de emergência (pula o gate)

# Evita deploys concorrentes pisando um no outro.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    # Só roda no repo oficial E quando o CI passou (ou em dispatch manual).
    if: >-
      ${{ github.repository_owner == 'ParkNow914' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    steps:
      # Faz checkout do EXATO commit que passou no CI (head_sha do run que
      # disparou); em dispatch manual, usa o ref selecionado.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Sem o secret FLY_API_TOKEN o deploy é PULADO com aviso (em vez de
      # falhar vermelho sem explicação).
      - name: Verificar FLY_API_TOKEN
        id: token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN não configurado — deploy pulado. Gere com 'fly tokens create deploy' e adicione como secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup flyctl
        if: steps.token.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Migrations rodam como release_command (fly.toml) antes da troca de
      # tráfego; se falharem, o deploy aborta — sem `|| true` mascarando erro.
      - name: Deploy
        if: steps.token.outputs.configured == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
