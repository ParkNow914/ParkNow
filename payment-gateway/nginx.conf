# Número de processos worker, geralmente igual ao número de núcleos da CPU
worker_processes auto;

events {
  # Número máximo de conexões por worker
  worker_connections 1024;
  # Aceita múltiplas conexões
  multi_accept on;
  # Usa o método de E/S mais eficiente disponível
  use epoll;
}

# Configuração HTTP
http {
  # Configurações de log
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Configurações básicas
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 20M;

  # Configuração de tipos MIME
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Configuração de compressão
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Configuração de cache
  open_file_cache max=200000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Configuração de timeouts
  client_body_timeout 12;
  client_header_timeout 12;
  send_timeout 10;

  # Configuração do servidor
  server {
    listen 80;
    server_name api.parknow.com.br;
    
    # Redireciona todo o tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
  }


  server {
    listen 443 ssl http2;
    server_name api.parknow.com.br;
    
    # Configurações SSL
    ssl_certificate /etc/letsencrypt/live/api.parknow.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.parknow.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Configurações de protocolo SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    
    # Configurações de cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Configuração de cache para ativos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, no-transform";
      access_log off;
      log_not_found off;
      
      # Configuração para servir arquivos estáticos diretamente
      try_files $uri $uri/ =404;
    }
    
    # Configuração para a API
    location /api {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      
      # Configurações de timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      # Configuração de buffer
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }
    
    # Configuração para a documentação da API
    location /api-docs {
      proxy_pass http://app:3000/api-docs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
    
    # Configuração para health check
    location /health {
      proxy_pass http://app:3000/health;
      access_log off;
    }
    
    # Configuração para negar acesso a arquivos ocultos
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
    
    # Configuração para lidar com erros
    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
