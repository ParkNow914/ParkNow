# fly.toml app configuration file generated for parknow-alimi on 2026-05-25T08:48:45-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parknow-alimi'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  BODY_LIMIT = '2mb'
  LOG_LEVEL = 'info'
  LOG_TO_FILE = 'false'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=200'
  PG_CONNECTION_TIMEOUT_MS = '10000'
  PG_IDLE_TIMEOUT_MS = '30000'
  PG_MAX_CONNECTIONS = '5'
  PORT = '3000'
  REALTIME_ENABLED = 'true'
  TRUST_PROXY = '1'
  TZ = 'America/Sao_Paulo'

[[mounts]]
  source = 'parknow_uploads'
  destination = '/app/uploads'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
