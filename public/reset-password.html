<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - ParkNow</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- CSS Principal (opcional, pode herdar se servido corretamente) -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Estilos específicos para esta página */
        body {
            background: linear-gradient(to bottom right, #002850, #004080, #54C87D); /* Gradiente invertido */
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Open Sans', sans-serif; padding: 20px;
        }
        .logo-container { margin-bottom: 35px; text-align: center; }
        .logo-container img { max-width: 220px; height: auto; }
        .reset-container {
            background-color: #ffffff; /* Fundo branco sólido */
            padding: 40px 45px; /* Mais padding */
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            max-width: 480px; width: 100%; color: #333;
            border-top: 5px solid #54C87D; /* Detalhe verde no topo */
        }
        .reset-container h2 { font-family: 'Days One', sans-serif; color: #004080; margin-bottom: 20px; text-align: center; font-size: 1.9rem; }
        .reset-container .text-muted { font-size: 0.95rem; margin-bottom: 30px;}
        .form-label { font-weight: 600; color: #495057; margin-bottom: 0.5rem; }
        .form-control { border-radius: 5px; border: 1px solid #ced4da; padding: 11px 14px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); transition: all 0.3s ease; font-size: 1rem;}
        .form-control:focus { border-color: #54C87D; box-shadow: 0 0 0 0.2rem rgba(84, 200, 125, 0.25), inset 0 1px 2px rgba(0,0,0,0.05); outline: none; }
        .invalid-feedback { display: none; width: 100%; margin-top: .25rem; font-size: 80%; color: #dc3545; }
        .is-invalid { border-color: #dc3545 !important; } .is-invalid ~ .invalid-feedback { display: block; }
        .btn-primary { background: linear-gradient(to right, #54C87D, #43a065); border: none; padding: 11px 25px; font-weight: 600; font-size: 1.05rem; transition: all 0.3s ease; border-radius: 5px; }
        .btn-primary:hover { background: linear-gradient(to right, #43a065, #54C87D); transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .btn-primary:disabled { cursor: not-allowed; opacity: 0.7; }
        .btn-primary .spinner-border-sm { width: 1rem; height: 1rem; border-width: .2em; margin-right: 8px; vertical-align: -0.15em; }
        #reset-page-feedback .alert { font-size: 0.95rem; }
        .link-voltar { color: #495057; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; }
        .link-voltar:hover { color: #0056b3; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo-container">
         <a href="/"><img src="/img/logo.png" alt="ParkNow Logo"></a>
    </div>

    <!-- Container do Formulário -->
    <div class="reset-container">
        <h2><i class="fas fa-key mr-2"></i> Definir Nova Senha</h2>
        <p class="text-center text-muted mb-4">Crie uma senha nova e segura para sua conta.</p>

        <!-- Formulário de Reset -->
        <form id="resetPasswordFormPage" novalidate autocomplete="on">
            <!-- Input oculto para o token (preenchido via JS) -->
            <input type="hidden" id="resetTokenPage" name="token" value="">
            <input type="hidden" id="resetPasswordUsernamePage" name="username" autocomplete="username">

            <!-- Campo Nova Senha -->
            <div class="form-group">
                <label for="resetPasswordInputPage" class="form-label">Nova Senha*</label>
                <input type="password" class="form-control" id="resetPasswordInputPage" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                <div class="invalid-feedback">Senha inválida ou muito curta (mínimo 6 caracteres).</div>
            </div>

            <!-- Campo Confirmar Senha -->
             <div class="form-group">
                <label for="resetPasswordConfirmPage" class="form-label">Confirmar Nova Senha*</label>
                <input type="password" class="form-control" id="resetPasswordConfirmPage" name="confirmPassword" placeholder="Digite a nova senha novamente" autocomplete="new-password" required>
                <div class="invalid-feedback">As senhas não coincidem.</div>
            </div>

            <!-- Botão de Submit -->
            <button type="submit" class="btn btn-primary btn-block mt-4">
                 <span class="spinner-border spinner-border-sm" style="display: none;"></span>
                <i class="fas fa-save mr-1"></i> Redefinir Senha
            </button>

            <!-- Área de Feedback/Alertas -->
            <div id="reset-page-feedback" class="mt-3" style="display: none;">
                <!-- Alertas Bootstrap serão inseridos aqui pelo JS -->
            </div>
        </form>

        <!-- Link para voltar -->
        <div class="text-center mt-4">
            <a href="/index.html" class="link-voltar"> <i class="fas fa-arrow-left"></i> Voltar para Login</a>
        </div>
    </div>

    <!-- Scripts Essenciais (jQuery e Bootstrap JS) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Script JavaScript específico para esta página -->
    <!-- <script src="/js/reset-password.js"></script> --> <!-- Se estiver em arquivo separado -->
    <script src="/js/reset-password-page.inline-1.js"></script>
</body>
</html>
