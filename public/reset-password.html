<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - ParkNow</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- CSS Principal (opcional, pode herdar se servido corretamente) -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Estilos específicos para esta página */
        body {
            background: linear-gradient(to bottom right, #002850, #004080, #54C87D); /* Gradiente invertido */
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Open Sans', sans-serif; padding: 20px;
        }
        .logo-container { margin-bottom: 35px; text-align: center; }
        .logo-container img { max-width: 220px; height: auto; }
        .reset-container {
            background-color: #ffffff; /* Fundo branco sólido */
            padding: 40px 45px; /* Mais padding */
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            max-width: 480px; width: 100%; color: #333;
            border-top: 5px solid #54C87D; /* Detalhe verde no topo */
        }
        .reset-container h2 { font-family: 'Days One', sans-serif; color: #004080; margin-bottom: 20px; text-align: center; font-size: 1.9rem; }
        .reset-container .text-muted { font-size: 0.95rem; margin-bottom: 30px;}
        .form-label { font-weight: 600; color: #495057; margin-bottom: 0.5rem; }
        .form-control { border-radius: 5px; border: 1px solid #ced4da; padding: 11px 14px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); transition: all 0.3s ease; font-size: 1rem;}
        .form-control:focus { border-color: #54C87D; box-shadow: 0 0 0 0.2rem rgba(84, 200, 125, 0.25), inset 0 1px 2px rgba(0,0,0,0.05); outline: none; }
        .invalid-feedback { display: none; width: 100%; margin-top: .25rem; font-size: 80%; color: #dc3545; }
        .is-invalid { border-color: #dc3545 !important; } .is-invalid ~ .invalid-feedback { display: block; }
        .btn-primary { background: linear-gradient(to right, #54C87D, #43a065); border: none; padding: 11px 25px; font-weight: 600; font-size: 1.05rem; transition: all 0.3s ease; border-radius: 5px; }
        .btn-primary:hover { background: linear-gradient(to right, #43a065, #54C87D); transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .btn-primary:disabled { cursor: not-allowed; opacity: 0.7; }
        .btn-primary .spinner-border-sm { width: 1rem; height: 1rem; border-width: .2em; margin-right: 8px; vertical-align: -0.15em; }
        #reset-page-feedback .alert { font-size: 0.95rem; }
        .link-voltar { color: #495057; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; }
        .link-voltar:hover { color: #0056b3; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo-container">
         <a href="/"><img src="/img/logo.png" alt="ParkNow Logo"></a>
    </div>

    <!-- Container do Formulário -->
    <div class="reset-container">
        <h2><i class="fas fa-key mr-2"></i> Definir Nova Senha</h2>
        <p class="text-center text-muted mb-4">Crie uma senha nova e segura para sua conta.</p>

        <!-- Formulário de Reset -->
        <form id="resetPasswordFormPage" novalidate autocomplete="on">
            <!-- Input oculto para o token (preenchido via JS) -->
            <input type="hidden" id="resetTokenPage" name="token" value="">
            <input type="hidden" id="resetPasswordUsernamePage" name="username" autocomplete="username">

            <!-- Campo Nova Senha -->
            <div class="form-group">
                <label for="resetPasswordInputPage" class="form-label">Nova Senha*</label>
                <input type="password" class="form-control" id="resetPasswordInputPage" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                <div class="invalid-feedback">Senha inválida ou muito curta (mínimo 6 caracteres).</div>
            </div>

            <!-- Campo Confirmar Senha -->
             <div class="form-group">
                <label for="resetPasswordConfirmPage" class="form-label">Confirmar Nova Senha*</label>
                <input type="password" class="form-control" id="resetPasswordConfirmPage" name="confirmPassword" placeholder="Digite a nova senha novamente" autocomplete="new-password" required>
                <div class="invalid-feedback">As senhas não coincidem.</div>
            </div>

            <!-- Botão de Submit -->
            <button type="submit" class="btn btn-primary btn-block mt-4">
                 <span class="spinner-border spinner-border-sm" style="display: none;"></span>
                <i class="fas fa-save mr-1"></i> Redefinir Senha
            </button>

            <!-- Área de Feedback/Alertas -->
            <div id="reset-page-feedback" class="mt-3" style="display: none;">
                <!-- Alertas Bootstrap serão inseridos aqui pelo JS -->
            </div>
        </form>

        <!-- Link para voltar -->
        <div class="text-center mt-4">
            <a href="/index.html" class="link-voltar"> <i class="fas fa-arrow-left"></i> Voltar para Login</a>
        </div>
    </div>

    <!-- Scripts Essenciais (jQuery e Bootstrap JS) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Script JavaScript específico para esta página -->
    <!-- <script src="/js/reset-password.js"></script> --> <!-- Se estiver em arquivo separado -->
    <script>
        // Script JS para reset-password.html (Conteúdo de /js/reset-password.js)
        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('resetPasswordFormPage');
            const tokenInput = document.getElementById('resetTokenPage');
            const passwordInput = document.getElementById('resetPasswordInputPage');
            const confirmInput = document.getElementById('resetPasswordConfirmPage');
            const feedbackDiv = document.getElementById('reset-page-feedback');
            const submitButton = resetForm?.querySelector('button[type="submit"]');

            // --- Funções Feedback ---
            const showLoading = (isLoading) => { if(!submitButton) return; submitButton.disabled = isLoading; const s=submitButton.querySelector('.spinner-border'); const i=submitButton.querySelector('i'); if(isLoading){if(i)i.style.display='none'; if(s)s.style.display='inline-block'; let tN=Array.from(submitButton.childNodes).find(n=>n.nodeType===Node.TEXT_NODE&&n.nodeValue.trim().length>0); if(tN)tN.nodeValue=' Redefinindo...'; else submitButton.insertAdjacentText('beforeend', ' Redefinindo...');} else {if(i)i.style.display=''; if(s)s.style.display='none'; let lTN=Array.from(submitButton.childNodes).find(n=>n.nodeType===Node.TEXT_NODE&&n.nodeValue.includes('Redefinindo')); if(lTN)submitButton.removeChild(lTN); let cT=Array.from(submitButton.childNodes).find(n=>n.nodeType===Node.TEXT_NODE)?.nodeValue?.trim(); if(!cT) submitButton.insertAdjacentText(i?'beforeend':'afterbegin',' Redefinir Senha');}};
            const showAlert = (message, type = 'danger') => { if(feedbackDiv){ feedbackDiv.innerHTML=`<div class="alert alert-${type} alert-dismissible fade show m-0" role="alert">${message}<button type="button" class="close" data-dismiss="alert">×</button></div>`; feedbackDiv.style.display='block'; } else { alert(message); }};
            const hideAlert = () => { if(feedbackDiv) feedbackDiv.style.display = 'none'; };
            const setErrorFor = (input, message) => { if(!input) return; input.classList.add('is-invalid'); const el=input.parentNode.querySelector('.invalid-feedback'); if(el) {el.textContent=message; el.style.display='block';}};
            const clearErrorFor = (input) => { if(!input) return; input.classList.remove('is-invalid'); const el=input.parentNode.querySelector('.invalid-feedback'); if(el) el.style.display='none';};

            // --- Extração Token ---
            const extractTokenFromURL = () => { const p=window.location.pathname.split('/'); return p.find(part => /^[a-f0-9]{64}$/i.test(part)) || null; };
            const token = extractTokenFromURL();
            if (token && tokenInput) { tokenInput.value = token; } else { showAlert('Token inválido ou não encontrado na URL.', 'danger'); if(submitButton) submitButton.disabled = true; }

            // --- Submit Handler ---
            if (resetForm && token) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault(); let isValid = true; hideAlert(); clearErrorFor(passwordInput); clearErrorFor(confirmInput);
                    if (passwordInput.value.length < 6) { setErrorFor(passwordInput, 'Mínimo 6 caracteres.'); isValid = false; }
                    if (passwordInput.value !== confirmInput.value) { setErrorFor(confirmInput, 'Senhas não coincidem.'); isValid = false; }
                    if (!isValid) return; showLoading(true);
                    try {
                        const response = await fetch(`/api/auth/reset-password/${token}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: passwordInput.value }) });
                        const result = await response.json(); if (!response.ok) { if(response.status===422&&result.errors)throw new Error(result.errors.map(er=>er.msg).join(' ')); throw new Error(result.message||`Erro ${response.status}`); }
                        showAlert(result.message || 'Senha redefinida! Volte e faça login.', 'success'); resetForm.reset(); if(submitButton) submitButton.disabled = true;
                        // Opcional: Redirecionar
                        // setTimeout(() => { window.location.href = '/index.html'; }, 4000);
                    } catch (error) { showAlert(`Erro: ${error.message}`, 'danger');
                    } finally { showLoading(false); }
                });
            } else if (resetForm && !token) { showAlert('Não foi possível encontrar o token.', 'warning'); if(submitButton) submitButton.disabled = true; }
        });
    </script>
</body>
</html>
