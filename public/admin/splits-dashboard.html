<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Splits - ParkNow</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.3;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn-export {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        
        .btn-export:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
        }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .filter-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-white">
                <i class="fas fa-chart-line me-2"></i>Dashboard de Splits
            </h1>
            <a href="/admin/dashboard.html" class="btn btn-light">
                <i class="fas fa-arrow-left me-2"></i>Voltar
            </a>
        </div>

        <!-- Cards de Estatísticas -->
        <div class="row">
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <i class="fas fa-dollar-sign stat-icon text-success"></i>
                    <div class="stat-value text-success" id="receitaTotal">R$ 0,00</div>
                    <div class="stat-label">Receita Total (ParkNow)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <i class="fas fa-money-bill-wave stat-icon text-primary"></i>
                    <div class="stat-value text-primary" id="totalTransacoes">0</div>
                    <div class="stat-label">Total de Transações</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <i class="fas fa-calendar-day stat-icon text-warning"></i>
                    <div class="stat-value text-warning" id="receitaHoje">R$ 0,00</div>
                    <div class="stat-label">Receita Hoje</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <i class="fas fa-calendar-alt stat-icon text-info"></i>
                    <div class="stat-value text-info" id="receitaMes">R$ 0,00</div>
                    <div class="stat-label">Receita Mês Atual</div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filter-card">
            <h5 class="mb-3">
                <i class="fas fa-filter me-2"></i>Filtros
            </h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Data Início</label>
                    <input type="date" class="form-control" id="dataInicio">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data Fim</label>
                    <input type="date" class="form-control" id="dataFim">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Estacionamento</label>
                    <select class="form-select" id="estacionamentoFiltro">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" onclick="aplicarFiltros()">
                            <i class="fas fa-search me-2"></i>Buscar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Transações -->
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5>
                    <i class="fas fa-list me-2"></i>Transações Recentes
                </h5>
                <button class="btn btn-export" onclick="exportarCSV()">
                    <i class="fas fa-download me-2"></i>Exportar CSV
                </button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Estacionamento</th>
                            <th>Cliente</th>
                            <th>Valor Total</th>
                            <th>Comissão (15%)</th>
                            <th>Estacionamento (85%)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTransacoes">
                        <tr>
                            <td colspan="8" class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Base URL da API
        const API_BASE_URL = window.location.origin;

        // Função para obter o token JWT
        function getAuthToken() {
            return localStorage.getItem('token');
        }

        // Função para fazer requisições autenticadas
        async function fetchWithAuth(url, options = {}) {
            const token = getAuthToken();
            
            if (!token) {
                window.location.href = '/admin/login.html';
                return;
            }

            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            };

            const response = await fetch(API_BASE_URL + url, {
                ...options,
                headers
            });

            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/admin/login.html';
                return;
            }

            return response;
        }

        // Formatar moeda
        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // Formatar data
        function formatarData(dataStr) {
            const data = new Date(dataStr);
            return data.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Carregar estatísticas
        async function carregarEstatisticas() {
            try {
                const response = await fetchWithAuth('/api/admin/splits/estatisticas');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('receitaTotal').textContent = 
                        formatarMoeda(data.data.receita_total || 0);
                    document.getElementById('totalTransacoes').textContent = 
                        data.data.total_transacoes || 0;
                    document.getElementById('receitaHoje').textContent = 
                        formatarMoeda(data.data.receita_hoje || 0);
                    document.getElementById('receitaMes').textContent = 
                        formatarMoeda(data.data.receita_mes || 0);
                }
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        // Carregar lista de estacionamentos para o filtro
        async function carregarEstacionamentos() {
            try {
                const response = await fetchWithAuth('/api/admin/estacionamentos');
                const data = await response.json();

                if (data.success) {
                    const select = document.getElementById('estacionamentoFiltro');
                    data.data.forEach(est => {
                        const option = document.createElement('option');
                        option.value = est.id;
                        option.textContent = est.nome;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar estacionamentos:', error);
            }
        }

        // Carregar transações
        async function carregarTransacoes(filtros = {}) {
            try {
                let url = '/api/admin/splits/transacoes?limite=100';
                
                if (filtros.dataInicio) {
                    url += `&data_inicio=${filtros.dataInicio}`;
                }
                if (filtros.dataFim) {
                    url += `&data_fim=${filtros.dataFim}`;
                }
                if (filtros.estacionamento) {
                    url += `&estacionamento_id=${filtros.estacionamento}`;
                }

                const response = await fetchWithAuth(url);
                const data = await response.json();

                const tbody = document.getElementById('tabelaTransacoes');
                tbody.innerHTML = '';

                if (data.success && data.data.length > 0) {
                    data.data.forEach(transacao => {
                        const tr = document.createElement('tr');
                        
                        const statusClass = 
                            transacao.status === 'approved' ? 'status-approved' :
                            transacao.status === 'pending' ? 'status-pending' :
                            'status-rejected';
                        
                        const statusText = 
                            transacao.status === 'approved' ? 'Aprovado' :
                            transacao.status === 'pending' ? 'Pendente' :
                            'Rejeitado';

                        tr.innerHTML = `
                            <td>#${transacao.id}</td>
                            <td>${formatarData(transacao.created_at)}</td>
                            <td>${transacao.estacionamento_nome || 'N/A'}</td>
                            <td>${transacao.cliente_nome || 'N/A'}</td>
                            <td><strong>${formatarMoeda(transacao.valor_total)}</strong></td>
                            <td class="text-success">${formatarMoeda(transacao.comissao_plataforma)}</td>
                            <td class="text-primary">${formatarMoeda(transacao.valor_estacionamento)}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Nenhuma transação encontrada</td></tr>';
                }
            } catch (error) {
                console.error('Erro ao carregar transações:', error);
                const tbody = document.getElementById('tabelaTransacoes');
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Erro ao carregar dados</td></tr>';
            }
        }

        // Aplicar filtros
        function aplicarFiltros() {
            const filtros = {
                dataInicio: document.getElementById('dataInicio').value,
                dataFim: document.getElementById('dataFim').value,
                estacionamento: document.getElementById('estacionamentoFiltro').value
            };
            
            carregarTransacoes(filtros);
        }

        // Exportar para CSV
        function exportarCSV() {
            const tabela = document.getElementById('tabelaTransacoes');
            const linhas = tabela.querySelectorAll('tr');
            
            let csv = 'ID,Data,Estacionamento,Cliente,Valor Total,Comissão ParkNow,Valor Estacionamento,Status\n';
            
            linhas.forEach(linha => {
                const colunas = linha.querySelectorAll('td');
                if (colunas.length > 0) {
                    const dados = Array.from(colunas).map(col => 
                        `"${col.textContent.trim().replace(/"/g, '""')}"`
                    );
                    csv += dados.join(',') + '\n';
                }
            });

            // Criar blob e download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `splits_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Inicializar dashboard
        document.addEventListener('DOMContentLoaded', () => {
            carregarEstatisticas();
            carregarEstacionamentos();
            carregarTransacoes();
            
            // Atualizar estatísticas a cada 30 segundos
            setInterval(carregarEstatisticas, 30000);
        });
    </script>
</body>
</html>
