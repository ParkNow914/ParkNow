<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline — ParkNow</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --primary: #54C87D; --dark: #1a202c; --muted: #718096; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f7fafc 0%, #e2e8f0 100%); color: var(--dark);
    }
    .container { text-align: center; padding: 2rem; max-width: 480px; }
    .code { font-size: 6rem; font-weight: 800; color: var(--primary); line-height: 1; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); margin-bottom: 2rem; }
    a.btn {
      display: inline-block; padding: .75rem 2rem; border-radius: 8px;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 600;
      transition: opacity .2s;
    }
    a.btn:hover { opacity: .9; }
  </style>
</head>
<body>
  <main class="container">
    <div class="code">Offline</div>
    <h1>Você está offline</h1>
    <p>Sem conexão no momento. Verifique sua internet e tente novamente.</p>
    <a class="btn" href="/" onclick="location.reload();return false;">Tentar novamente</a>
  </main>
</body>
</html>
